services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Softspring\CmsTranslationPlugin\Form\Admin\:
        resource: '../../src/Form/Admin/*'

    Softspring\CmsTranslationPlugin\Admin\Menu\ContentMenuProvider:
        tags: [ 'sfs_cms.admin_menu.content_menu_provider' ]

    Softspring\CmsTranslationPlugin\Admin\Menu\SectionMenuProvider:
        tags: [ 'sfs_cms.admin_menu.section_menu_provider' ]

    Softspring\CmsTranslationPlugin\Admin\Routing\AdminRoutingProvider:
        tags: [ 'sfs_cms.admin_routing_provider' ]

    Softspring\CmsTranslationPlugin\Translator\TranslatorExtractor: ~

    Softspring\CmsTranslationPlugin\Exchange\Xliff12Exchanger:
        tags: [ 'sfs_cms.translation_plugin.exchanger' ]

    Softspring\CmsTranslationPlugin\Exchange\Exchanger:
        arguments: [!tagged_iterator { tag: 'sfs_cms.translation_plugin.exchanger', default_index_method: 'format' }]

    sfs_cms_translation_plugin.content_version.statistics_listener:
        class: Softspring\CmsTranslationPlugin\EntityListener\VersionTranslationStatisticsListener
        tags:
            - { name: 'doctrine.orm.entity_listener', event: 'prePersist', entity: 'Softspring\CmsBundle\Entity\ContentVersion',  priority: 15 } #, entity_manager: '%sfs_cms.entity_manager_name%' }

    sfs_cms_translation_plugin.section_version.statistics_listener:
        class: Softspring\CmsTranslationPlugin\EntityListener\VersionTranslationStatisticsListener
        tags:
            - { name: 'doctrine.orm.entity_listener', event: 'prePersist', entity: 'Softspring\CmsBundle\Entity\SectionVersion',  priority: 15 } #, entity_manager: '%sfs_cms.entity_manager_name%' }

